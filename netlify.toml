[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/get-content"
  status = 200

[[redirects]]
  from = "/api/publish"
  to = "/.netlify/functions/publish-content"
  status = 200

[[redirects]]
  from = "/"
  to = "/public/"
  status = 302
